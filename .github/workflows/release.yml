# Build, sign, and publish the desktop client for macOS (the current internal
# development target). The version must carry a `-beta` prerelease suffix —
# stable versions are not published from this workflow.
#
# The release job assembles the updater manifest (latest.json) from the
# signed updater archives and attaches it to the GitHub Release, which the
# client's "Check for Updates…" and the startup check consume.
#
# Secrets (repository settings → Actions):
#   TAURI_SIGNING_PRIVATE_KEY          contents of the private key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD the key password
# (generate with: pnpm run signer-key)

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0-beta.1); defaults to the package.json version. Must contain -beta.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve and validate the version
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          case "$version" in
            *-beta*) ;;
            *) echo "release: version must contain -beta (got $version)"; exit 1 ;;
          esac
          if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-beta(\.[0-9]+)?)?$'; then
            echo "release: version is not valid semver with a -beta prerelease: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    needs: [version]
    # Internal development target: Apple Silicon only (macos-latest is
    # arm64), to keep the CI/CD loop as fast as possible. The bundled Node
    # runtime is arch-specific, so the updater manifest is darwin-aarch64.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the shell frontend
        run: pnpm build

      - name: Assemble the bundled runtime (with size pruning)
        # DSH_DESKTOP_PRUNE=1 (opt-in in assemble-runtime.mjs) strips the
        # bundled node binary and drops dead weight (.map/.d.ts, node-pty
        # cross-platform prebuilds, READMEs/tests): ~97 MiB -> ~63 MiB.
        # strip + codesign run on the macOS runner (Xcode is preinstalled).
        # APPLE_SIGNING_IDENTITY makes assemble-runtime.mjs sign every
        # Mach-O inside the archive (required by Apple notarization, which
        # unpacks it and rejects unsigned executables).
        env:
          DSH_DESKTOP_PRUNE: '1'
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: pnpm run runtime

      - name: Smoke-test the assembled runtime
        run: pnpm run smoke

      - name: Write the updater config override
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          node -e "
            const fs = require('node:fs');
            fs.writeFileSync(
              'tauri.release.config.json',
              JSON.stringify({
                version: process.env.VERSION,
                plugins: {
                  updater: {
                    endpoints: ['https://github.com/' + process.env.REPO + '/releases/latest/download/latest.json'],
                  },
                },
              }, null, 2),
            );
          "

      - name: Import Developer ID certificate
        # signMachOs (inside assemble-runtime.mjs) and Tauri's .app signing
        # both need the Developer ID cert in a keychain. Import it into a
        # dedicated build keychain before assembling.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/apple-cert.p12
          security create-keychain -p dsh-temp dsh-build.keychain
          security default-keychain -s dsh-build.keychain
          security unlock-keychain -p dsh-temp dsh-build.keychain
          security import /tmp/apple-cert.p12 -k dsh-build.keychain             -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s             -k dsh-temp dsh-build.keychain

      - name: Prepare Apple API key file for notarization
        # Tauri reads the App Store Connect API key from APPLE_API_KEY_PATH;
        # the key content itself never appears in the logs (secrets only).
        run: echo "$APPLE_API_KEY" > /tmp/apple_api_key.p8
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}

      - name: Build, sign, and notarize bundles
        # Tauri signs with the Developer ID identity (certificate imported
        # from APPLE_CERTIFICATE, see the docs) and notarizes via the
        # App Store Connect API key — no plaintext credentials anywhere.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_ISSUER_ID }}
          # APPLE_API_KEY is the API key ID (short alphanumeric), NOT the
          # .p8 file content; the key file itself is written from
          # APPLE_API_KEY_P8 in the step above.
          APPLE_API_KEY: ${{ secrets.APPLE_KEY_ID }}
          APPLE_API_KEY_PATH: /tmp/apple_api_key.p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: >-
          pnpm exec tauri build
          --config "${{ github.workspace }}/tauri.release.config.json"
          --bundles app,dmg

      - name: Rename assets to the DSH-DP convention
        # DSH-DP_{version}_{os}_{arch}.{ext} — short names that keep the
        # extension visible in the release asset list. No spaces (GitHub
        # would rewrite them to dots and break the latest.json URL).
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -e
          macos_dir="src-tauri/target/release/bundle/macos"
          dmg_dir="src-tauri/target/release/bundle/dmg"
          # updater archive + signature
          cd "$macos_dir"
          mv "DeepSeek Harness Developer Preview.app.tar.gz" "DSH-DP_${TAG}_macOS_aarch64.app.tar.gz"
          mv "DeepSeek Harness Developer Preview.app.tar.gz.sig" "DSH-DP_${TAG}_macOS_aarch64.app.tar.gz.sig"
          # DMG (name carries the version already)
          cd "$OLDPWD/$dmg_dir"
          mv "DeepSeek Harness Developer Preview_${TAG#v}_aarch64.dmg" "DSH-DP_${TAG}_macOS_aarch64.dmg"

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-aarch64
          path: |
            src-tauri/target/release/bundle/
            !src-tauri/target/release/bundle/macos/DeepSeek Harness Developer Preview.app/
          if-no-files-found: error

  release:
    needs: [version, build]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all bundles
        uses: actions/download-artifact@v8
        with:
          path: target-release
          merge-multiple: true

      - name: Verify required assets
        run: |
          set -e
          bundle="src-tauri/target/release/bundle"
          mkdir -p "$bundle"
          cp -R target-release/* "$bundle/"
          check() { # <glob>
            local found
            found=$(find "$bundle" -name "$1" | head -1)
            if [ -z "$found" ]; then echo "missing required asset: $1"; exit 1; fi
            echo "ok: $found"
          }
          check 'DSH-DP_*_macOS_aarch64.dmg'
          check 'DSH-DP_*_macOS_aarch64.app.tar.gz'
          check 'DSH-DP_*_macOS_aarch64.app.tar.gz.sig'

      - name: Assemble the updater manifest
        id: manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          bundle="src-tauri/target/release/bundle"
          base="https://github.com/$REPO/releases/download/$TAG"
          darwin_sig_aarch64=$(cat "$(find "$bundle" -name '*_macOS_aarch64.app.tar.gz.sig' | head -1)")
          # DSH-DP asset names carry no spaces, so they survive the GitHub
          # upload verbatim; no URL re-encoding needed.
          darwin_url_aarch64=$(basename "$(find "$bundle" -name '*_macOS_aarch64.app.tar.gz' | head -1)")
          pub_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$pub_date" \
            --arg darwin_sig_aarch64 "$darwin_sig_aarch64" \
            --arg darwin_url_aarch64 "$base/$darwin_url_aarch64" \
            '{version:$version, notes:"DeepSeek Harness Developer Preview", pub_date:$pub_date,
              platforms:{
                "darwin-aarch64":{signature:$darwin_sig_aarch64,url:$darwin_url_aarch64}
              }}' > "$bundle/latest.json"
          echo "latest.json:"
          cat "$bundle/latest.json"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          bundle="src-tauri/target/release/bundle"
          # Asset names contain spaces, so carry them as array elements, never
          # as a space-joined string.
          readarray -t assets < <(find "$bundle" -type f \
            \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \))
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          darwin_dmg=$(basename "$(find "$bundle" -name '*_macOS_aarch64.dmg' | head -1)")
          darwin_pkg=$(basename "$(find "$bundle" -name '*_macOS_aarch64.app.tar.gz' | head -1)")
          # Release notes: the per-version zh notes file (generated from the
          # changelog by scripts/gen-release-notes.mjs) is the default body;
          # fall back to a compact template when it is missing.
          notes_file="docs/release-notes/${TAG}-zh.md"
          if [[ -f "$notes_file" ]]; then
            notes="$(cat "$notes_file")

          ## 📦 下载（Download）

          ### macOS · Apple Silicon（arm64）
          - 安装包（DMG）：[$darwin_dmg]($base/$darwin_dmg)
          - 自动更新包：[$darwin_pkg]($base/$darwin_pkg)"
          else
            notes="DeepSeek Harness Developer Preview — $VERSION

          **注意：这是开发预览版本（beta），仅供内部开发与测试。**

          - 内置 Node.js LTS 运行时与最新版 deepseek-harness（dsh web）
          - 系统托盘 / 会话完成通知 / 自动更新
          - 更新清单（latest.json）已附加，客户端启动时及菜单检查更新均会读取。

          ## 📦 下载（Download）

          ### macOS · Apple Silicon（arm64）
          - 安装包（DMG）：[$darwin_dmg]($base/$darwin_dmg)
          - 自动更新包：[$darwin_pkg]($base/$darwin_pkg)"
          fi
          gh release create "$TAG" "${assets[@]}" --title "$TAG" --notes "$notes" --prerelease
          gh release upload "$TAG" "$bundle/latest.json" --clobber
          # Every version is a prerelease, and GitHub refuses to mark a
          # prerelease as "latest", so /releases/latest never resolves for us.
          # The client therefore reads a fixed "updater-latest" tag (a plain,
          # non-prerelease release) whose latest.json asset we overwrite with
          # the newest manifest on every publish.
          if gh release view updater-latest >/dev/null 2>&1; then
            gh release upload updater-latest "$bundle/latest.json" --clobber
          else
            gh release create updater-latest "$bundle/latest.json" \
              --title "updater-latest" \
              --notes "Updater pointer: the newest latest.json update manifest lives here (overwritten on every release)."
          fi
          echo "published $TAG (+ updater-latest pointer)"

      - name: Verify the published updater manifest
        # Post-release end-to-end check of the automatic-update chain the
        # client consumes: the fixed updater-latest pointer must now carry
        # THIS release's version, and its darwin-aarch64 archive URL must be
        # reachable. Fails the job loudly if the pointer was not overwritten
        # or the archive is missing (see scripts/verify-update.mjs).
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/verify-update.mjs --expect-version "$VERSION"
