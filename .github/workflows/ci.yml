# CI: verify the frontend build and the Rust sources compile.
#
# The Linux runtime is deliberately NOT assembled here. CI would otherwise
# download a Node binary + pnpm and run a full `npm install` for the bundled
# runtime every time, while the resulting `runtime-linux-x64` artifact is not
# consumed downstream — release.yml builds its own macOS runtime.
#
# Trigger policy (internal dev loop: commits are frequent; release.yml builds
# its own macOS runtime). To save runner minutes:
#   - pull_request:      full CI (validate before merging, any changed paths)
#   - push to main:      only when relevant code/build paths change (docs-only
#                        commits skip the build)
#   - workflow_dispatch: manual full CI on demand

name: ci

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'index.html'
      - 'public/**'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scanning (gitleaks)
        # Fails the run if any secret pattern (API key, password, …) is
        # committed. No plaintext credentials ever belong in the repo, commit
        # messages, release notes, or workflow output.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The SARIF artifact has no consumer here (no GHAS code scanning);
          # uploading one on every run just accumulates storage.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build the shell frontend
        run: pnpm build

      - name: Create placeholder runtime resource for Rust compile check
        # tauri-build requires every configured resource to exist, even during
        # `cargo check`. CI deliberately does not assemble the real Linux
        # runtime (that work is only needed by release.yml on macOS), so an
        # empty file is enough for the Rust source compile check.
        run: mkdir -p resources && touch resources/runtime.tar.gz

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache keys on Cargo.lock + rust toolchain, so repeated
        # `cargo check --release` runs reuse ~/.cargo and target/ instead of
        # recompiling the Tauri dependency tree from scratch.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Verify the Rust sources compile
        run: |
          cd src-tauri
          cargo check --release
