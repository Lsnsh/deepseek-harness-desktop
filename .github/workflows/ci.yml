# CI: verify the frontend build, assemble the bundled runtime, and smoke-test
# it exactly the way the desktop shell starts it.
#
# Trigger policy (internal dev loop: commits are frequent, and the CI artifact
# — a Linux runtime archive — is not consumed downstream; release.yml builds
# its own macOS runtime). To save runner minutes:
#   - pull_request:      full CI (validate before merging, any changed paths)
#   - push to main:      only when runtime/code paths change (docs-only
#                        commits skip the build)
#   - workflow_dispatch: manual full CI on demand

name: ci

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'index.html'
      - 'public/**'
      - '.github/workflows/ci.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build the shell frontend
        run: pnpm build

      - name: Assemble the bundled runtime
        run: pnpm run runtime

      - name: Smoke-test the assembled runtime
        run: pnpm run smoke

      - name: Cache Rust build artifacts
        # Swatinem/rust-cache keys on Cargo.lock + rust toolchain, so repeated
        # `cargo check --release` runs reuse ~/.cargo and target/ instead of
        # recompiling the Tauri dependency tree from scratch.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Verify the Rust sources compile
        run: |
          cd src-tauri
          cargo check --release

      - name: Upload the runtime archive as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: runtime-linux-x64
          path: resources/runtime.tar.gz
          if-no-files-found: error
