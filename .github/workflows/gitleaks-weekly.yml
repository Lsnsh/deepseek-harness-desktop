# Periodic secret scan with gitleaks. CI runs gitleaks on every push/PR;
# this workflow re-scans the whole history weekly and on demand, so a
# credential that slipped in and was later amended still gets flagged.
#
# Keep secrets out of: repository files, commit messages, release notes,
# and workflow output. If a leak is found, rotate the credential AND scrub
# history (git filter-repo) before re-enabling CI.

name: gitleaks-weekly

on:
  schedule:
    # Weekly: Monday 03:23 UTC (11:23 UTC+8).
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan full history (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: '@lsnsh'
          # The SARIF artifact has no consumer here (no GHAS code scanning);
          # uploading one on every run just accumulates storage.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Open an issue when a leak is found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: ['security'],
            });
            if (data.length > 0) { console.log('issue already open'); return; }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: 'gitleaks: 检测到可能的机密泄露（rotate + scrub history）',
              labels: ['security'],
              body: [
                'Weekly gitleaks scan flagged a possible secret leak.',
                '',
                '1. 立即轮换（rotate）相关凭据；',
                '2. 用 `git filter-repo` 清洗历史；',
                '3. 修复后重跑本工作流确认干净。',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });
