<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plugin Manager — DeepSeek Harness</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --panel: #111a2e;
      --fg: #e2e8f0;
      --muted: #8ba0b8;
      --accent: #4f8cff;
      --danger: #ff6b6b;
      --ok: #34d399;
      --update: #ffc107;
      --border: rgba(139, 160, 184, 0.18);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: radial-gradient(900px 500px at 50% -10%, #16224a 0%, var(--bg) 60%);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.55;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 28px 24px 48px; }
    header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 22px; }
    h1 { font-size: 19px; font-weight: 600; margin: 0; }
    .tag { font-size: 11px; color: var(--accent); border: 1px solid rgba(79,140,255,.4); border-radius: 999px; padding: 2px 9px; }
    h2 { font-size: 14px; font-weight: 600; margin: 26px 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
    .search { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--fg);
      padding: 9px 14px;
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 18px;
      cursor: pointer;
    }
    button.secondary { background: rgba(255,255,255,.08); color: var(--fg); }
    button.danger { background: rgba(255,107,107,.15); color: var(--danger); }
    button.armed { background: rgba(255,193,7,.22); color: var(--update); }
    button:disabled { opacity: .5; cursor: default; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      flex: none;
      object-fit: cover;
      background: rgba(255,255,255,.06);
    }
    .card .meta { flex: 1; min-width: 0; }
    .card .name { font-weight: 600; font-size: 14px; }
    .card .desc { color: var(--muted); font-size: 12.5px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .stars { color: var(--muted); font-size: 12px; flex: none; }
    .empty { color: var(--muted); font-size: 13px; padding: 12px 4px; }
    .notice {
      background: rgba(79,140,255,.1);
      border: 1px solid rgba(79,140,255,.3);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 14px;
    }
    .notice b { color: var(--accent); }
    .badge { font-size: 11px; border-radius: 6px; padding: 1px 7px; margin-left: 6px; }
    .badge.installed { background: rgba(52,211,153,.15); color: var(--ok); }
    .badge.update { background: rgba(255,193,7,.15); color: var(--update); }
    .badge.plain { background: rgba(139,160,184,.15); color: var(--muted); }
    .ver { color: var(--muted); font-size: 11px; font-weight: 400; margin-left: 6px; }
    #log {
      color: var(--muted); font-size: 12px; margin-top: 10px;
      min-height: 18px; max-height: 240px; overflow-y: auto;
      white-space: pre-wrap; word-break: break-all;
      background: rgba(0,0,0,.25); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Plugin Manager</h1>
      <span class="tag">dsh-plugin · GitHub</span>
    </header>

    <h2>已安装</h2>
    <div id="installed" class="empty">加载中…</div>
    <div class="notice" id="restartNotice" style="display:none">
      已开始 <b>自动重启 Web 服务</b> 使变更生效（主窗口会短暂回到启动页，随后自动进入界面）。
    </div>

    <h2>从 GitHub 安装</h2>
    <div class="search">
      <input type="text" id="q" placeholder="搜索 dsh-plugin 插件（留空显示热门）" />
      <button id="searchBtn" onclick="doSearch()">搜索</button>
    </div>
    <div id="results" class="empty" style="margin-top:12px">输入关键词搜索 GitHub 上的 dsh-plugin 插件。</div>

    <div id="log"></div>
  </div>

  <script>
    const invoke = window.__TAURI__.core.invoke;
    const logEl = document.getElementById('log');
    // The operation currently streaming into #log ("install" | "uninstall" | null).
    let currentOp = null;

    window.__TAURI__.event.listen('plugin-progress', (event) => {
      const p = event.payload || {};
      if (!currentOp || p.op !== currentOp) return;
      if (p.line) {
        appendProgress(p.line);
      } else if (p.done) {
        appendProgress(`── ${p.ok ? '完成' : '失败'} ──`);
      }
    });

    function appendProgress(line) {
      logEl.textContent = (logEl.textContent ? logEl.textContent + '\n' : '') + line;
      logEl.scrollTop = logEl.scrollHeight;
    }
    function clearProgress() { logEl.textContent = ''; }
    function log(msg) { logEl.textContent = msg; logEl.scrollTop = logEl.scrollHeight; }

    async function refreshInstalled() {
      const el = document.getElementById('installed');
      try {
        const m = await invoke('list_plugins');
        const names = m.dependencies || [];
        const versions = m.versions || {};
        const updates = m.updates || [];
        if (names.length === 0) {
          el.className = 'empty';
          el.textContent = '尚未安装任何插件。';
          return;
        }
        el.className = '';
        el.innerHTML = '';
        const repoMeta = m.repos || {};
        for (const name of names) {
          const card = document.createElement('div');
          card.className = 'card';
          // Optional GitHub decoration (only for GitHub-sourced plugins):
          // owner avatar + repo description. Absent entries render nothing.
          const metaData = repoMeta[name] || {};
          if (metaData.owner_avatar) {
            const img = document.createElement('img');
            img.className = 'avatar';
            img.src = metaData.owner_avatar;
            img.alt = '';
            img.referrerPolicy = 'no-referrer';
            card.appendChild(img);
          }
          const meta = document.createElement('div');
          meta.className = 'meta';
          const activeBundle = (m.bundles || []).includes(name);
          let nameHtml = `<div class="name">${esc(name)}`;
          if (versions[name]) nameHtml += `<span class="ver">v${esc(versions[name])}</span>`;
          if (updates.includes(name)) nameHtml += `<span class="badge update">有更新</span>`;
          if (!activeBundle) nameHtml += `<span class="badge plain">未激活</span>`;
          nameHtml += '</div>';
          if (metaData.description) {
            nameHtml += `<div class="desc">${esc(metaData.description)}</div>`;
          }
          // A dependency that declares no dsh.bundle never joins the profile's
          // bundle stack: it loads nothing at boot. Make that state visible —
          // it is the usual reason an install "shows but has no effect".
          if (!activeBundle) {
            nameHtml += `<div class="desc">未激活：该包未声明 dsh.bundle，不会作为配置层加载（安装成功也无界面效果）。</div>`;
          }
          meta.innerHTML = nameHtml;
          const badge = document.createElement('span');
          badge.className = 'badge installed';
          badge.textContent = '已安装';
          const btn = document.createElement('button');
          btn.className = 'danger';
          btn.textContent = '卸载';
          btn.addEventListener('click', () => uninstall(name, btn));
          card.append(meta, badge, btn);
          el.appendChild(card);
        }
      } catch (e) {
        el.className = 'empty';
        el.textContent = '读取失败：' + e;
      }
    }

    async function doSearch() {
      const q = document.getElementById('q').value.trim();
      const el = document.getElementById('results');
      const btn = document.getElementById('searchBtn');
      btn.disabled = true;
      el.className = 'empty';
      el.textContent = '搜索中…';
      try {
        const repos = await invoke('search_plugins', { query: q });
        if (repos.length === 0) { el.textContent = '没有找到结果。'; return; }
        el.className = '';
        el.innerHTML = '';
        for (const r of repos) {
          const card = document.createElement('div');
          card.className = 'card';
          // Owner avatar rides along in the search response (zero extra API
          // calls); render it when present.
          if (r.avatar_url) {
            const img = document.createElement('img');
            img.className = 'avatar';
            img.src = r.avatar_url;
            img.alt = '';
            img.referrerPolicy = 'no-referrer';
            card.appendChild(img);
          }
          const desc = r.description || '（无描述）';
          const meta = document.createElement('div');
          meta.className = 'meta';
          meta.innerHTML = `
            <div class="name">${esc(r.full_name)}</div>
            <div class="desc">${esc(desc)}</div>`;
          const stars = document.createElement('div');
          stars.className = 'stars';
          stars.textContent = '⭐ ' + Number(r.stars || 0).toLocaleString();
          const btn = document.createElement('button');
          btn.textContent = '安装';
          btn.dataset.fullName = r.full_name;
          btn.dataset.stars = String(r.stars || 0);
          btn.dataset.desc = r.description || '';
          btn.addEventListener('click', () => requestInstall(btn));
          card.append(meta, stars, btn);
          el.appendChild(card);
        }
      } catch (e) {
        el.className = 'empty';
        el.textContent = '搜索失败：' + e;
      } finally {
        btn.disabled = false;
      }
    }

    // window.confirm is a silent no-op in the macOS WKWebView (wry installs
    // no JS-dialog UI delegate), so confirmations use a two-step button:
    // the first click arms the button, a second click within 4s proceeds,
    // and the hint text (install warning / uninstall prompt) is shown in the
    // log area while armed. No native dialogs involved.
    function armButton(btn, idleLabel, armedLabel, hint, onConfirm) {
      if (btn.dataset.armed !== '1') {
        btn.dataset.armed = '1';
        btn.textContent = armedLabel;
        btn.classList.add('armed');
        log(hint);
        setTimeout(() => {
          if (btn.dataset.armed === '1') {
            btn.dataset.armed = '0';
            btn.textContent = idleLabel;
            btn.classList.remove('armed');
          }
        }, 4000);
        return;
      }
      btn.dataset.armed = '0';
      btn.textContent = idleLabel;
      btn.classList.remove('armed');
      onConfirm();
    }

    function requestInstall(btn) {
      const fullName = btn.dataset.fullName;
      const stars = Number(btn.dataset.stars || 0).toLocaleString();
      const desc = btn.dataset.desc || '（无描述）';
      armButton(
        btn,
        '安装',
        '⚠ 再次点击确认安装',
        `⚠️ 即将安装 ${fullName}（⭐ ${stars} · ${desc}）\n` +
          `第三方代码将以本应用同等权限执行；安装前会校验该仓库 package.json 是否声明 dsh.bundle / dsh.client 插件契约。\n` +
          `再次点击「⚠ 再次点击确认安装」开始安装。`,
        () => install(fullName, btn),
      );
    }

    async function install(spec, btn) {
      btn.disabled = true;
      btn.textContent = '安装中…';
      clearProgress();
      currentOp = 'install';
      log(`校验并安装 ${spec}（可能需要几分钟，git 源会编译构建脚本）`);
      try {
        const r = await invoke('install_plugin', { spec });
        appendProgress(r.output ? r.output.trim() : (r.ok ? '安装成功。' : '安装失败。'));
        if (r.ok) {
          document.getElementById('restartNotice').style.display = '';
          await refreshInstalled();
        }
      } catch (e) {
        appendProgress('安装失败：' + e);
      } finally {
        currentOp = null;
        btn.disabled = false;
        btn.textContent = '安装';
      }
    }

    function uninstall(name, btn) {
      armButton(
        btn,
        '卸载',
        '⚠ 再次点击确认卸载',
        `确定卸载 ${name}？再次点击「⚠ 再次点击确认卸载」执行。`,
        () => doUninstall(name, btn),
      );
    }

    async function doUninstall(name, btn) {
      btn.disabled = true;
      btn.textContent = '卸载中…';
      clearProgress();
      currentOp = 'uninstall';
      log(`dsh plugin remove ${name}`);
      try {
        const r = await invoke('uninstall_plugin', { name });
        appendProgress(r.output ? r.output.trim() : (r.ok ? '卸载成功。' : '卸载失败。'));
        if (r.ok) {
          document.getElementById('restartNotice').style.display = '';
          await refreshInstalled();
        }
      } catch (e) {
        appendProgress('卸载失败：' + e);
      } finally {
        currentOp = null;
        btn.disabled = false;
        btn.textContent = '卸载';
      }
    }

    function esc(s) { return s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

    document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
    refreshInstalled();
  </script>
</body>
</html>
