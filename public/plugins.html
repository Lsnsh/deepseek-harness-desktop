<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plugin Manager — DeepSeek Harness</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --panel: #111a2e;
      --fg: #e2e8f0;
      --muted: #8ba0b8;
      --accent: #4f8cff;
      --danger: #ff6b6b;
      --ok: #34d399;
      --border: rgba(139, 160, 184, 0.18);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: radial-gradient(900px 500px at 50% -10%, #16224a 0%, var(--bg) 60%);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.55;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 28px 24px 48px; }
    header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 22px; }
    h1 { font-size: 19px; font-weight: 600; margin: 0; }
    .tag { font-size: 11px; color: var(--accent); border: 1px solid rgba(79,140,255,.4); border-radius: 999px; padding: 2px 9px; }
    h2 { font-size: 14px; font-weight: 600; margin: 26px 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
    .search { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--fg);
      padding: 9px 14px;
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 18px;
      cursor: pointer;
    }
    button.secondary { background: rgba(255,255,255,.08); color: var(--fg); }
    button.danger { background: rgba(255,107,107,.15); color: var(--danger); }
    button:disabled { opacity: .5; cursor: default; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .card .meta { flex: 1; min-width: 0; }
    .card .name { font-weight: 600; font-size: 14px; }
    .card .desc { color: var(--muted); font-size: 12.5px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .stars { color: var(--muted); font-size: 12px; flex: none; }
    .empty { color: var(--muted); font-size: 13px; padding: 12px 4px; }
    .notice {
      background: rgba(79,140,255,.1);
      border: 1px solid rgba(79,140,255,.3);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 14px;
    }
    .notice b { color: var(--accent); }
    #log { color: var(--muted); font-size: 12px; margin-top: 10px; min-height: 16px; white-space: pre-wrap; }
    .badge { font-size: 11px; border-radius: 6px; padding: 1px 7px; }
    .badge.installed { background: rgba(52,211,153,.15); color: var(--ok); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Plugin Manager</h1>
      <span class="tag">dsh-plugin · GitHub</span>
    </header>

    <h2>已安装</h2>
    <div id="installed" class="empty">加载中…</div>
    <div class="notice" id="restartNotice" style="display:none">
      插件安装/卸载后需 <b>重启 Web 服务</b> 生效（菜单：DeepSeek Harness → Restart Web Server）。
    </div>

    <h2>从 GitHub 安装</h2>
    <div class="search">
      <input type="text" id="q" placeholder="搜索 dsh-plugin 插件（留空显示热门）" />
      <button id="searchBtn" onclick="doSearch()">搜索</button>
    </div>
    <div id="results" class="empty" style="margin-top:12px">输入关键词搜索 GitHub 上的 dsh-plugin 插件。</div>

    <div id="log"></div>
  </div>

  <script>
    const invoke = window.__TAURI__.core.invoke;

    async function refreshInstalled() {
      const el = document.getElementById('installed');
      try {
        const m = await invoke('list_plugins');
        const names = m.dependencies || [];
        if (names.length === 0) {
          el.className = 'empty';
          el.textContent = '尚未安装任何插件。';
          return;
        }
        el.className = '';
        el.innerHTML = '';
        for (const name of names) {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `<div class="meta"><div class="name">${esc(name)}</div></div>
            <span class="badge installed">已安装</span>
            <button class="danger" onclick="uninstall('${esc(name)}')">卸载</button>`;
          el.appendChild(card);
        }
      } catch (e) {
        el.className = 'empty';
        el.textContent = '读取失败：' + e;
      }
    }

    async function doSearch() {
      const q = document.getElementById('q').value.trim();
      const el = document.getElementById('results');
      const btn = document.getElementById('searchBtn');
      btn.disabled = true;
      el.className = 'empty';
      el.textContent = '搜索中…';
      try {
        const repos = await invoke('search_plugins', { query: q });
        if (repos.length === 0) { el.textContent = '没有找到结果。'; return; }
        el.className = '';
        el.innerHTML = '';
        for (const r of repos) {
          const card = document.createElement('div');
          card.className = 'card';
          const desc = r.description || '（无描述）';
          card.innerHTML = `
            <div class="meta">
              <div class="name">${esc(r.full_name)}</div>
              <div class="desc">${esc(desc)}</div>
            </div>
            <div class="stars">⭐ ${r.stars.toLocaleString()}</div>
            <button onclick="install('${esc(r.full_name)}')">安装</button>`;
          el.appendChild(card);
        }
      } catch (e) {
        el.className = 'empty';
        el.textContent = '搜索失败：' + e;
      } finally {
        btn.disabled = false;
      }
    }

    async function install(spec) {
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = '安装中…';
      log(`dsh plugin add ${spec}（可能需要几分钟，git 源会编译构建脚本）`);
      try {
        const r = await invoke('install_plugin', { spec });
        log(r.output || (r.ok ? '安装成功。' : '安装失败。'));
        if (r.ok) {
          document.getElementById('restartNotice').style.display = '';
          await refreshInstalled();
        }
      } catch (e) {
        log('安装失败：' + e);
      } finally {
        btn.disabled = false;
        btn.textContent = '安装';
      }
    }

    async function uninstall(name) {
      if (!confirm(`确定卸载 ${name}？`)) return;
      log(`dsh plugin remove ${name}`);
      try {
        const r = await invoke('uninstall_plugin', { name });
        log(r.output || (r.ok ? '卸载成功。' : '卸载失败。'));
        if (r.ok) {
          document.getElementById('restartNotice').style.display = '';
          await refreshInstalled();
        }
      } catch (e) {
        log('卸载失败：' + e);
      }
    }

    function log(msg) { document.getElementById('log').textContent = msg; }
    function esc(s) { return s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

    document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
    refreshInstalled();
  </script>
</body>
</html>
