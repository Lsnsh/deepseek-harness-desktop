<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek Harness — 启动失败</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --fg: #dbe4f0;
      --muted: #8ba0b8;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(1200px 800px at 50% -10%, #2a1420 0%, var(--bg) 55%);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    .wrap { max-width: 560px; padding: 32px; text-align: left; }
    .icon { font-size: 34px; line-height: 1; margin-bottom: 14px; }
    h1 { font-size: 19px; font-weight: 600; margin: 0 0 10px; }
    p { color: var(--muted); font-size: 13.5px; line-height: 1.6; margin: 0 0 10px; }
    ul { color: var(--muted); font-size: 13px; line-height: 1.7; margin: 0 0 14px; padding-left: 20px; }
    code {
      background: rgba(255,255,255,0.07);
      padding: 1px 6px;
      border-radius: 5px;
      font-size: 12px;
      color: var(--fg);
    }
    .danger { color: var(--danger); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">⚠️</div>
    <h1>本地服务启动失败</h1>
    <p>DeepSeek Harness 无法启动它内置的本地服务。可能的原因：</p>
    <ul>
      <li>系统环境不兼容（例如 macOS 上被 Gatekeeper 拦截）</li>
      <li><code>$HOME</code> 目录不可写，或 <code>DSH_HOME</code> 指向了不可写位置</li>
      <li>磁盘空间不足，或杀毒软件拦截了内置的运行时</li>
    </ul>
    <p>请关闭应用后重试。如果问题持续，可查看日志文件定位原因：</p>
    <p><code id="logpath">（日志路径见应用输出）</code></p>
    <p class="danger">注意：关闭此窗口将同时停止后台服务。</p>
  </div>
</body>
</html>
